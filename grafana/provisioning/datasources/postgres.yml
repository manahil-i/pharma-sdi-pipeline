# Grafana reads this at start-up and creates the PostgreSQL data source automatically.
apiVersion: 1
datasources:
  - name: PharmaPostgres
    uid: pharma-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: airflow
    isDefault: true
    jsonData:
      database: pharma
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: airflow
