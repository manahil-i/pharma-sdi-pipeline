# =====================================================================
# SDI pipeline – everything runs in Docker:
#   postgres   : Airflow's own database + our "pharma" database (staging + monitoring)
#   airflow-*  : orchestration (web UI on http://localhost:8080, user airflow / airflow)
#   grafana    : monitoring dashboards (http://localhost:3000, user admin / admin)
#   sdi-api    : our ingestion API (http://localhost:8000/docs)
# The DuckDB data mart is a file: ./mart/sdi_mart.duckdb
# Start:  docker compose up -d --build        Stop:  docker compose down
# =====================================================================
x-airflow-common: &airflow-common
  build: .
  image: sdi-airflow:2.10.4
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: "utc"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__WEBSERVER__WORKERS: "2"              # fewer web workers = less memory on a laptop
    AIRFLOW__WEBSERVER__SECRET_KEY: "sdi-milestone1-local-key"   # same key in all containers (task logs in the UI)
    PYTHONPATH: /opt/airflow/scripts
    SDI_HOME: /opt/airflow
    PHARMA_DB_HOST: postgres
    PHARMA_DB_PORT: "5432"
    PHARMA_DB_NAME: pharma
    PHARMA_DB_USER: airflow
    PHARMA_DB_PASSWORD: airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./scripts:/opt/airflow/scripts
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - ./mart:/opt/airflow/mart
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d      # creates the "pharma" database on first start
    ports:
      - "5433:5432"          # from your laptop (DBeaver): localhost:5433
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/data /opt/airflow/mart || true
        exec /entrypoint airflow version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    user: "0:0"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  sdi-api:                                  # our own ingestion API -> http://localhost:8000/docs
    build: ./api
    image: sdi-api:1.0
    environment:
      PYTHONPATH: /app/scripts
      SDI_HOME: /app
      PHARMA_DB_HOST: postgres
      PHARMA_DB_PORT: "5432"
      PHARMA_DB_NAME: pharma
      PHARMA_DB_USER: airflow
      PHARMA_DB_PASSWORD: airflow
      AIRFLOW_API_URL: http://airflow-webserver:8080/api/v1
      AIRFLOW_API_AUTH: airflow:airflow
    volumes:
      - ./api:/app/api              # the API code
      - ./scripts:/app/scripts      # re-uses config.py and api_trigger.py of the pipeline
      - ./data:/app/data            # writes into data/landing
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning   # data source + dashboard folder (auto)
      - ./grafana/dashboards:/etc/grafana/dashboards       # the 4 dashboard JSON files
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  pg-data:
  grafana-data:
